}
@font-face{
  font-family:'Fraunces';font-style:italic;font-weight:400;font-display:swap;

}

:root{--encre:#16333A;--encre-70:rgba(22,51,58,.72);--brume:#F5F6F2;--blanc:#FFFFFF;--citron:#D9A62E;--trait:rgba(22,51,58,.14);--rayon:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Karla',system-ui,sans-serif;background:var(--brume);color:var(--encre);line-height:1.7;font-size:16.5px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:clamp(1.9rem,4vw,2.7rem);line-height:1.15;margin-bottom:.4em}
h2{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:1.25rem;margin:1.8em 0 .5em}
p,li{max-width:70ch;color:var(--encre-70)}
ul{padding-left:1.2em;margin:.4em 0}
strong{color:var(--encre)}
a{color:var(--encre)}
.cadre{width:min(860px,92%);margin:0 auto;padding:60px 0 80px}
.retour{display:inline-block;margin-bottom:34px;text-decoration:none;font-weight:700;border-bottom:2px solid var(--citron)}
.bloc{background:var(--blanc);border:1px solid var(--trait);border-radius:var(--rayon);padding:30px;margin-top:26px}
.a-remplir{background:#FFF6DE;border:1.5px dashed var(--citron);border-radius:10px;padding:2px 8px;font-weight:700}
footer{border-top:1px solid var(--trait);padding:26px 0;font-size:.85rem;color:var(--encre-70);text-align:center}
</style>
</head>
